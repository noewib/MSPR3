apiVersion: apps/v1
kind: Deployment
metadata:
  name: edf-consumption-predictor-api-local
  namespace: default
  labels:
    app: edf-consumption-predictor
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edf-consumption-predictor
  template:
    metadata:
      labels:
        app: edf-consumption-predictor
    spec:
      containers:
      - name: predictor-api
        image: predictor-api:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
